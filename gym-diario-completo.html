<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario de Gym</title>
<style>
:root{--bg:#f3f1ec;--card:#ffffff;--tx:#1b1a18;--mu:#7a776e;--ac:#e8590c;--ac2:#ffffff;--acs:#ffe8d9;--bd:#e7e4dc;--ok:#2f9e44;--sh:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(30,20,10,.07);--r:16px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--card:#1c1c1a;--tx:#f2f0ea;--mu:#97948a;--ac:#ff7a3d;--ac2:#161615;--acs:#3a2418;--bd:#2e2e2a;--ok:#69db7c;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--card:#1c1c1a;--tx:#f2f0ea;--mu:#97948a;--ac:#ff7a3d;--ac2:#161615;--acs:#3a2418;--bd:#2e2e2a;--ok:#69db7c;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:radial-gradient(900px 340px at 50% -120px,var(--acs),transparent)}
main{max-width:620px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
h2{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.12em;margin:28px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;align-items:center}
.sb{justify-content:space-between}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.75}
input[type=number]{width:78px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
input.grow,textarea{flex:1;width:100%}
textarea{resize:vertical;border-radius:var(--r)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:var(--ac2);font-weight:700;transition:transform .08s,filter .15s,background .15s}
button:hover{filter:brightness(1.07)}
button:active{transform:scale(.96)}
button.g{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);font-weight:600}
button.g:hover{border-color:var(--ac);color:var(--ac)}
button.x{background:transparent;color:var(--mu);padding:6px 9px;border-radius:8px}
button.x:hover{background:var(--acs);color:var(--ac)}
.seg{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:3px;box-shadow:var(--sh)}
.seg button{border-radius:9px!important;padding:5px 12px;border:0}
.seg button.off{background:transparent;color:var(--mu)}
#st{font-size:13px;color:var(--mu);min-height:20px;margin:0 2px 10px}
.hint{color:var(--mu);font-size:13px;margin:0 0 10px}
#mt{font-size:17px;font-weight:800;letter-spacing:-.01em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal .wd{text-align:center;font-size:11px;font-weight:700;color:var(--mu);padding-bottom:2px}
.cal button{background:var(--bg);color:var(--tx);border:1.5px solid transparent;min-height:52px;padding:3px;font-weight:600;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;line-height:1.15;position:relative}
.cal button small{font-size:10px;font-weight:600;color:var(--mu)}
.cal button.dot::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.cal button.dot small{margin-bottom:6px}
.cal button.td{border-color:var(--ac)}
.cal button.sel{background:var(--ac);color:var(--ac2);border-color:var(--ac);box-shadow:0 4px 12px rgba(232,89,12,.35)}
.cal button.sel small{color:var(--ac2);opacity:.9}
.cal button.sel.dot::after{background:var(--ac2)}
.cal .e{background:none;border:0;box-shadow:none;cursor:default}
#dt{font-size:18px;font-weight:800;letter-spacing:-.01em}
.lb{font-size:13px;color:var(--mu);font-weight:600}
.ex-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ex-h b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.set{margin:8px 0;padding:6px 8px;background:var(--bg);border-radius:12px}
.set span.n{width:24px;height:24px;border-radius:50%;background:var(--acs);color:var(--ac);font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.set input{background:var(--card)}
.set .cv{color:var(--mu);font-size:13px;min-width:74px;font-weight:600;flex:1}
.vol{font-size:13px;color:var(--mu);font-weight:600}
.hist{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;transition:transform .12s,border-color .15s}
.hist:hover{border-color:var(--ac);transform:translateY(-1px)}
.hist small{color:var(--mu)}
@media (max-width:380px){input[type=number]{width:64px}.set .cv{display:none}}
select{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:9px 10px;min-width:0}
select:focus{outline:0;border-color:var(--ac)}
#tocaT{font-size:22px;font-weight:800;letter-spacing:-.01em}
.wk{margin:6px 0}.wk b{width:34px;color:var(--ac)}
.ln{fill:none;stroke:var(--ac);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--card);stroke:var(--ac);stroke-width:3}
.gl{stroke:var(--bd);stroke-width:1}
.tx{fill:var(--mu);font-size:12px}.tv{fill:var(--tx);font-size:12px;font-weight:700}
#ch svg{display:block;margin-top:10px}
main{max-width:1240px}
.two{display:grid;grid-template-columns:1fr;gap:20px;margin-top:10px}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr;align-items:start}}
.app{min-width:0;border-top:4px solid var(--ac);padding-top:12px}
:root{--bl:#1c7ed6}
.app[data-p="b"]{--ac:#1c7ed6;--acs:#dcebfb}
.app[data-p="b"] .cal button.sel{box-shadow:0 4px 12px rgba(28,126,214,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bl:#4dabf7}:root:not([data-theme="light"]) .app[data-p="b"]{--ac:#4dabf7;--acs:#14283a}}
.pname{font-size:22px;font-weight:800;letter-spacing:-.01em;border:0;background:transparent;border-bottom:2px solid var(--bd);border-radius:0;padding:4px 0}
.pname:focus{box-shadow:none;border-bottom-color:var(--ac)}
.lna{stroke:var(--ac)}.lnb{stroke:var(--bl)}.pna{stroke:var(--ac)}.pnb{stroke:var(--bl)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#cmch svg{display:block;max-width:760px;margin:10px auto 0}
.top{display:grid;grid-template-columns:1fr;gap:0 18px;margin:10px 0}
@media (min-width:900px){.top{grid-template-columns:1fr 1fr;align-items:start}}
.dots{position:absolute;bottom:4px;display:flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1.5px var(--bg)}
.dots .da{background:var(--ac)}.dots .db{background:var(--bl)}
.cal button.hd small{margin-bottom:8px}
.cal button.sel .dots i{box-shadow:0 0 0 1.5px var(--ac)}
.cal button.sel .dots .da{background:var(--ac2)}
select.gsel{padding:4px 8px;font-size:13px;border-radius:8px}
button.g.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.gr{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.gr small{color:var(--mu)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mo[hidden]{display:none!important}
.mb{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:var(--sh)}
</style>
</head>
<body>
<main>
<div class="row sb" style="flex-wrap:wrap"><h1>🏋️ Diario de Gym</h1>
<div class="row"><button class="g" id="jA"></button><button class="g" id="jB"></button><button class="g" id="jC">Comparar ↓</button></div></div>
<div class="top">
 <div>
  <div class="card" id="toca">
   <div class="row sb"><div><div class="lb" id="tocaS"></div><div id="tocaT"></div></div>
   <div class="row"><button class="g" id="goT">Ir a hoy</button><button class="g" id="editW">Semana base</button></div></div>
   <div id="weekEd" hidden></div>
  </div>
  <div class="card" id="dayc">
   <div class="row sb" style="margin-bottom:8px"><b id="dt"></b><button class="g" id="today">Hoy</button></div>
   <div class="row"><label class="lb">Hora</label><input type="time" id="time"><input class="grow" id="plan" placeholder="Rutina de los dos (ej. Pierna, Pecho y tríceps)"></div>
   <div id="chips" class="row" style="flex-wrap:wrap;margin-top:8px"></div>
   <p class="hint" id="dh" style="margin:8px 0 0"></p>
   <div id="sst" class="hint" style="margin:6px 0 0"></div>
  </div>
 </div>
 <div class="card"><div class="row sb"><button class="g" id="pm">←</button><b id="mt"></b><button class="g" id="nm">→</button></div>
  <div class="cal" id="cal"></div>
  <p class="hint" style="margin:10px 0 0"><i class="sw" style="background:var(--ac)"></i><span id="lgA">Julián</span> · <i class="sw" style="background:var(--bl)"></i><span id="lgB">Yaseth</span>: el punto marca quién ya entrenó ese día.</p></div>
</div>
<div class="two"><section class="app" data-p="a" id="pa"></section><section class="app" data-p="b" id="pb"></section></div>
<div class="card" id="cmp" style="margin-top:22px">
  <h2 style="margin-top:0">Comparar avance</h2>
  <div class="row" style="flex-wrap:wrap"><select id="cmx" class="grow"></select>
   <div class="seg row" style="gap:0"><button id="cmw">Peso</button><button id="cmv" class="off">Volumen</button></div>
   <div class="seg row" style="gap:0"><button id="cul">lb</button><button id="cuk" class="off">kg</button></div></div>
  <div id="cmch"></div><div id="cml" class="row" style="flex-wrap:wrap;gap:14px;margin-top:6px"></div><p class="hint" id="cms" style="margin:6px 0 0"></p>
</div>
</main>
<div class="mo" id="modal" hidden><div class="mb"><p id="mm" style="margin:0 0 12px;font-weight:600"></p><input id="mi" class="grow" style="margin-bottom:12px" hidden><div class="row" id="mbtn" style="flex-wrap:wrap;justify-content:flex-end"></div></div></div>
<template id="tpl">
<div class="row sb"><input id="pname" class="pname grow" placeholder="Nombre" maxlength="20"><div class="seg row" style="gap:0"><button id="ulb">lb</button><button id="ukg" class="off">kg</button></div></div>
<p class="hint" style="margin:2px 0 8px" id="uh"></p>
<div id="st">Cargando…</div>
<p class="hint" id="dl" style="font-weight:700;color:var(--tx);margin:0 0 10px"></p>
<div id="log"></div>
<div class="card">
  <div class="row">
    <input class="grow" id="newEx" list="exlist" placeholder="Ejercicio (ej. Press banca)">
    <button id="addEx">Añadir</button>
  </div>
  <datalist id="exlist"></datalist>
  <div id="gq" hidden><p class="hint" id="gh" style="margin:12px 0 8px"><b>¿Qué tipo de ejercicio es?</b></p><div id="gb" class="row" style="flex-wrap:wrap"></div></div>
</div>
<textarea id="notes" rows="2" placeholder="Notas del día (peso corporal, cómo te sentiste…)"></textarea>
<h2>Progreso</h2>
<div class="card">
  <div class="row"><select id="cx" class="grow"></select><div class="seg row" style="gap:0"><button id="mw">Peso</button><button id="mv" class="off">Volumen</button></div></div>
  <div id="ch"></div><p class="hint" id="chs" style="margin:6px 0 0"></p>
</div>
<h2>Por grupo</h2>
<div class="card"><div id="gtabs" class="row" style="flex-wrap:wrap;gap:6px"></div><div id="gbody"></div></div>
<h2>Historial</h2>
<div class="row" style="margin-bottom:10px"><button class="g" id="exp">⬇ Descargar respaldo</button><label class="g" style="cursor:pointer;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;color:var(--mu)">⬆ Importar<input type="file" id="imp" accept=".json" hidden></label></div>
<div id="hist"></div>
</template>
<script>
function dlg(o){
  return new Promise(function(res){
    var m=document.getElementById("modal"),mi=document.getElementById("mi"),bt=document.getElementById("mbtn");
    document.getElementById("mm").textContent=o.text;
    mi.hidden=!("value" in o);if("value" in o)mi.value=o.value;
    bt.innerHTML="";
    function close(v){m.hidden=true;document.removeEventListener("keydown",kd);res({val:v,text:mi.value})}
    function kd(e){if(e.key==="Escape")close(null);else if(e.key==="Enter"&&!mi.hidden){var b=bt.lastChild;if(b)b.click()}}
    o.buttons.forEach(function(b){var e=document.createElement("button");e.textContent=b.label;e.className=b.cls===undefined?"g":b.cls;e.onclick=function(){close(b.val)};bt.appendChild(e)});
    document.addEventListener("keydown",kd);m.hidden=false;
    if(!mi.hidden){mi.focus();mi.select()}
  });
}
function App(root,pid){
var CM="w",SCH={},DN=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"],K=2.20462,W={},cur="",vm=null,col=null,pref=null,timer=null,loaded=false,U="lb";
var $=function(i){return root.querySelector("#"+i)};
var UK="gym-unit"+(pid==="a"?"":pid);
APPS[pid]={W:function(){return W},setCur:function(d){cur=d;render()},name:function(){return ($("pname").value||"").trim()||(pid==="a"?"Julián":"Yaseth")}};
root.querySelector("datalist").id="exlist-"+pid;$("newEx").setAttribute("list","exlist-"+pid);
$("pname").value=pid==="a"?"Julián":"Yaseth";
var MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function r1(v){return Math.round(v*10)/10}
function disp(kg,u){u=u||U;return kg===""||kg==null?"":r1(u==="lb"?kg*K:kg)}
function unDisp(v,u){u=u||U;return u==="lb"?v/K:v}
function other(kg,u){u=u||U;return kg===""||kg==null?"":(u==="lb"?r1(kg)+" kg":r1(kg*K)+" lb")}
function go(d){S.go(d)}
function day(){if(!W[cur])W[cur]={date:cur,notes:"",time:"",plan:"",exercises:[]};return W[cur]}
function esc(s){var e=document.createElement("div");e.textContent=s;return e.innerHTML}
var DB=null;
function idb(fn){return new Promise(function(res,rej){var tx=DB.transaction("workouts","readwrite");fn(tx.objectStore("workouts"));tx.oncomplete=function(){res()};tx.onerror=tx.onabort=function(){rej(tx.error)}})}
function save(){
  chartRender();S.calendar();
  $("st").textContent="Guardando…";
  clearTimeout(timer);
  timer=setTimeout(function(){
    timer=null;if(!DB)return;
    var d=day(),empty=!d.exercises.length&&!d.notes;
    if(empty)delete W[d.date];
    idb(function(st){if(empty)st.delete(d.date);else st.put({date:d.date,notes:d.notes,time:d.time,plan:d.plan,exercises:d.exercises})})
      .then(function(){$("st").textContent="✓ Guardado en la base de datos"}).catch(function(e){$("st").textContent="No se pudo guardar: "+(e&&e.message||e)});
  },400);
}
function last(name){
  var best=null;
  Object.keys(W).sort().reverse().forEach(function(k){
    if(best||k>=cur)return;
    (W[k].exercises||[]).forEach(function(e){if(!best&&e.name.toLowerCase()===name.toLowerCase())best={d:k,s:e.sets,u:e.unit}});
  });
  return best;
}
function setUnit(u,persist){
  U=u;$("ulb").className=u==="lb"?"":"off";$("ukg").className=u==="kg"?"":"off";
  $("uh").textContent=u==="lb"?"Unidad para ejercicios nuevos. Cada ejercicio tiene su propio botón lb / kg.":"Unidad para ejercicios nuevos. Cada ejercicio tiene su propio botón lb / kg.";
  if(persist){try{localStorage.setItem(UK,u)}catch(e){}}
  render();
}
function render(){
  chartRender();S.calendar();
  var d=W[cur]||{exercises:[],notes:"",time:"",plan:""},L=$("log");
  var p=parse(cur);
  $("dl").textContent=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][p.getDay()]+" "+p.getDate()+" de "+MES[p.getMonth()].toLowerCase();
  $("notes").value=d.notes||"";
  L.innerHTML="";
  d.exercises.forEach(function(ex,i){
    var c=document.createElement("div");c.className="card";
    var eu=ex.unit||U,l=last(ex.name),h=l?"Última vez ("+l.d+"): "+l.s.map(function(s){return s.reps+"×"+disp(s.kg,eu)+" "+eu}).join(", "):"Primera vez que lo registras";
    var vol=ex.sets.reduce(function(a,s){return a+(+s.reps||0)*(+s.kg||0)},0);
    c.innerHTML='<div class="ex-h"><b>'+esc(ex.name)+'</b><div class="row" style="gap:6px"><div class="seg row" style="gap:0"><button data-u="'+i+'_lb" class="'+(eu==="lb"?"":"off")+'">lb</button><button data-u="'+i+'_kg" class="'+(eu==="kg"?"":"off")+'">kg</button></div><button class="x" data-ed="'+i+'" title="Editar nombre">✏️</button><button class="x" data-ch="'+i+'" title="Ver progreso">📈</button><button class="x" data-del="'+i+'">✕</button></div></div><div class="row" style="margin:2px 0 6px"><select class="gsel" data-gi="'+i+'">'+gopts(ex.group)+'</select></div><p class="hint">'+esc(h)+'</p>'+
    ex.sets.map(function(s,j){var a='data-i="'+i+'" data-j="'+j+'"';return '<div class="row set"><span class="n">'+(j+1)+'</span><input type="number" inputmode="numeric" placeholder="reps" value="'+(s.reps===""?"":s.reps)+'" '+a+' data-f="reps"><span class="lb">reps ×</span><input type="number" inputmode="decimal" step="0.5" placeholder="'+eu+'" value="'+disp(s.kg,eu)+'" '+a+' data-f="kg"><span class="cv" id="cv'+i+'_'+j+'">'+(s.kg===""?"":"= "+other(s.kg,eu))+'</span><button class="x" data-rs="'+i+'_'+j+'">−</button></div>'}).join("")+
    '<div class="row sb" style="margin-top:8px"><button class="g" data-add="'+i+'">+ Serie</button><span class="vol" id="vol'+i+'">Volumen: '+Math.round(vol)+' kg · '+Math.round(vol*K)+' lb</span></div>';
    L.appendChild(c);
  });
  if(!d.exercises.length)L.innerHTML='<p class="hint">Aún no hay ejercicios este día. Añade el primero abajo 👇</p>';
  var names={};Object.keys(W).forEach(function(k){(W[k].exercises||[]).forEach(function(e){names[e.name]=1})});
  root.querySelector("datalist").innerHTML=Object.keys(names).map(function(n){return '<option value="'+esc(n)+'">'}).join("");
  var H=$("hist");H.innerHTML="";
  var keys=Object.keys(W).filter(function(k){return ne(W[k])}).sort().reverse();
  if(!keys.length)H.innerHTML='<p class="hint">Todavía no hay entrenamientos guardados.</p>';
  keys.forEach(function(k){
    var w=W[k],gs=[],n=(w.exercises||[]).length,sets=(w.exercises||[]).reduce(function(a,e){return a+e.sets.length},0);
    (w.exercises||[]).forEach(function(e){if(e.group&&gs.indexOf(e.group)<0)gs.push(e.group)});var r=document.createElement("div");r.className="card hist";
    r.innerHTML='<div><b>'+k+(S.planOf(k)?' · '+esc(S.planOf(k)):'')+'</b><br><small>'+(gs.length?gs.join(", ")+' · ':'')+(S.timeOf(k)?S.timeOf(k)+' · ':'')+n+' ejercicios · '+sets+' series</small></div>';
    r.onclick=function(){go(k);root.scrollIntoView({behavior:"smooth"})};
    H.appendChild(r);
  });
}
$("log").addEventListener("input",function(e){
  var t=e.target;if(!t.dataset.f)return;
  var i=+t.dataset.i,j=+t.dataset.j,ex=day().exercises[i],s=ex.sets[j];
  if(t.dataset.f==="reps")s.reps=t.value===""?"":+t.value;
  else{s.kg=t.value===""?"":Math.round(unDisp(+t.value,ex.unit||U)*100)/100;var cv=$("cv"+i+"_"+j);if(cv)cv.textContent=s.kg===""?"":"= "+other(s.kg,ex.unit||U)}
  var v=ex.sets.reduce(function(a,x){return a+(+x.reps||0)*(+x.kg||0)},0);
  $("vol"+i).textContent="Volumen: "+Math.round(v)+" kg · "+Math.round(v*K)+" lb";
  save();
});
$("log").addEventListener("click",function(e){
  var t=e.target,d=day();

gS("editW").onclick=function(){var e=gS("weekEd");e.hidden=!e.hidden;this.textContent=e.hidden?"Semana base":"Listo"};
gS("weekEd").addEventListener("input",function(e){
  var t=e.target;if(!t.dataset.n)return;
  var c=S.SCH[t.dataset.n]=S.SCH[t.dataset.n]||{plan:"",time:""};c[t.dataset.f]=t.value;
  S.saveMeta();S.calendar();S.renderToca();
});
(function(){
  if(!window.indexedDB){gS("sst").textContent="Tu navegador no permite bases de datos locales.";return}
  var rq=indexedDB.open("gym-diario-shared",1);
  rq.onupgradeneeded=function(){var db=rq.result;db.createObjectStore("days",{keyPath:"date"});db.createObjectStore("meta",{keyPath:"key"})};
  rq.onerror=function(){gS("sst").textContent="No se pudo abrir la base del calendario."};
  rq.onsuccess=function(){
    S.DB=rq.result;var tx=S.DB.transaction(["days","meta"]),g=tx.objectStore("days").getAll(),m=tx.objectStore("meta").get("schedule"),mg=tx.objectStore("meta").get("migrated");
    tx.oncomplete=function(){g.result.forEach(function(d){S.days[d.date]=d});S.SCH=(m.result&&m.result.days)||{};S.mig=!!mg.result;S.ready=true;S.fillWeek();S.render();S.tryMig()};
  };
})();
function mount(p){var r=document.getElementById("p"+p);r.appendChild(document.getElementById("tpl").content.cloneNode(true));App(r,p)}
function cmpRender(){
  var g=function(i){return document.getElementById(i)},ids=["a","b"].filter(function(p){return APPS[p]});
  ids.forEach(function(p){g("j"+p.toUpperCase()).textContent="Ir a "+APPS[p].name()});ids.forEach(function(p){g("lg"+p.toUpperCase()).textContent=APPS[p].name()});
  var seen={},list=[];
  ids.forEach(function(p){var W=APPS[p].W();Object.keys(W).forEach(function(k){(W[k].exercises||[]).forEach(function(e){var l=e.name.toLowerCase();if(!seen[l]){seen[l]=1;list.push(e.name)}})})});
  list.sort();
  var sel=g("cmx"),prev=sel.value;
  sel.innerHTML=list.map(function(n){var d=document.createElement("div");d.textContent=n;return "<option>"+d.innerHTML+"</option>"}).join("");
  if(list.indexOf(prev)>=0)sel.value=prev;
  var name=sel.value,box=g("cmch");
  if(!name){box.innerHTML='<p class="hint" style="margin-top:10px">Cuando alguno anote ejercicios, aquí se comparan los dos.</p>';g("cml").innerHTML="";g("cms").textContent="";return}
  var K=2.20462,ser=ids.map(function(p){
    var W=APPS[p].W(),pts=[];
    Object.keys(W).sort().forEach(function(k){(W[k].exercises||[]).forEach(function(e){
      if(e.name.toLowerCase()!==name.toLowerCase())return;
      var mx=0,vol=0;e.sets.forEach(function(s){var kg=+s.kg||0;if(kg>mx)mx=kg;vol+=kg*(+s.reps||0)});
      var v=CMM==="w"?mx:vol;if(v>0)pts.push({t:Date.parse(k+"T12:00:00"),k:k,y:CMU==="lb"?v*K:v});
    })});
    return {p:p,n:APPS[p].name(),pts:pts};
  });
  var all=[];ser.forEach(function(s){all=all.concat(s.pts)});
  if(!all.length){box.innerHTML='<p class="hint" style="margin-top:10px">Nadie tiene pesos anotados para este ejercicio.</p>';g("cml").innerHTML="";g("cms").textContent="";return}
  var Wd=600,Ht=250,pl=46,pr=16,pt=18,pb=32,t0=Infinity,t1=-Infinity,mn=Infinity,mx2=-Infinity;
  all.forEach(function(q){if(q.t<t0)t0=q.t;if(q.t>t1)t1=q.t;if(q.y<mn)mn=q.y;if(q.y>mx2)mx2=q.y});
  var span=(mx2-mn)||Math.max(mx2*0.2,1),lo=Math.max(0,mn-span*0.25),hi=mx2+span*0.25;
  function X(t){return t1===t0?(pl+(Wd-pl-pr)/2):pl+(t-t0)/(t1-t0)*(Wd-pl-pr)}
  function Y(v){return pt+(1-(v-lo)/(hi-lo))*(Ht-pt-pb)}
  var h="",i;
  for(i=0;i<=3;i++){var gv=lo+(hi-lo)*i/3,gy=Y(gv).toFixed(1);h+='<line class="gl" x1="'+pl+'" x2="'+(Wd-pr)+'" y1="'+gy+'" y2="'+gy+'"/><text class="tx" x="'+(pl-6)+'" y="'+(+gy+4)+'" text-anchor="end">'+Math.round(gv)+'</text>'}
  var nt=t1===t0?1:4;
  for(i=0;i<=nt;i++){var tt=nt?t0+(t1-t0)*i/nt:t0,dd=new Date(tt);h+='<text class="tx" x="'+X(tt).toFixed(1)+'" y="'+(Ht-10)+'" text-anchor="middle">'+(dd.getDate()<10?"0":"")+dd.getDate()+"/"+(dd.getMonth()<9?"0":"")+(dd.getMonth()+1)+'</text>'}
  ser.forEach(function(s){
    if(s.pts.length>1)h+='<path class="ln ln'+s.p+'" d="'+s.pts.map(function(q,j){return (j?"L":"M")+X(q.t).toFixed(1)+" "+Y(q.y).toFixed(1)}).join(" ")+'"/>';
    s.pts.forEach(function(q){h+='<circle class="pt pn'+s.p+'" cx="'+X(q.t).toFixed(1)+'" cy="'+Y(q.y).toFixed(1)+'" r="4.5"><title>'+s.n+" · "+q.k+" · "+Math.round(q.y*10)/10+" "+CMU+'</title></circle>'});
  });
  box.innerHTML='<svg viewBox="0 0 '+Wd+' '+Ht+'" width="100%" role="img" aria-label="Comparación">'+h+'</svg>';
  g("cml").innerHTML=ser.map(function(s){var d=document.createElement("div");d.textContent=s.n;return '<span><i class="sw" style="background:'+(s.p==="a"?"var(--ac)":"var(--bl)")+'"></i>'+d.innerHTML+'</span>'}).join("");
  g("cms").textContent=ser.map(function(s){var r1=function(v){return Math.round(v*10)/10},n=s.pts.length;return n?s.n+": "+r1(s.pts[0].y)+" → "+r1(s.pts[n-1].y)+" "+CMU+" ("+n+(n===1?" sesión)":" sesiones)"):s.n+": sin datos"}).join("  ·  ")+" · "+(CMM==="w"?"mejor peso del día":"volumen del día");
}
document.getElementById("cmx").onchange=cmpRender;
document.getElementById("cmw").onclick=function(){CMM="w";this.className="";document.getElementById("cmv").className="off";cmpRender()};
document.getElementById("cmv").onclick=function(){CMM="v";this.className="";document.getElementById("cmw").className="off";cmpRender()};
document.getElementById("cul").onclick=function(){CMU="lb";this.className="";document.getElementById("cuk").className="off";cmpRender()};
document.getElementById("cuk").onclick=function(){CMU="kg";this.className="";document.getElementById("cul").className="off";cmpRender()};
document.getElementById("jA").onclick=function(){document.getElementById("pa").scrollIntoView({behavior:"smooth"})};
document.getElementById("jB").onclick=function(){document.getElementById("pb").scrollIntoView({behavior:"smooth"})};
document.getElementById("jC").onclick=function(){document.getElementById("cmp").scrollIntoView({behavior:"smooth"})};
mount("a");mount("b");cmpRender();S.render();
</script>
